# /etc/nginx/sites-available/venysound.com
# 이 파일을 서버의 /etc/nginx/sites-available/venysound.com 에 복사 후
# sudo ln -s /etc/nginx/sites-available/venysound.com /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# www·apex 혼용 시 검색엔진 중복 방지: 표준 호스트는 https://venysound.com (apex)

# HTTP → HTTPS apex (한 번에 통일, www/http 혼선 방지)
server {
    listen 80;
    server_name venysound.com www.venysound.com;
    return 301 https://venysound.com$request_uri;
}

# HTTPS + www → HTTPS apex (주소창이 venysound.com 으로 바뀜)
server {
    listen 443 ssl http2;
    server_name www.venysound.com;

    ssl_certificate     /etc/letsencrypt/live/venysound.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venysound.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://venysound.com$request_uri;
}

# HTTPS apex — 실제 서비스
server {
    listen 443 ssl http2;
    server_name venysound.com;

    ssl_certificate     /etc/letsencrypt/live/venysound.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venysound.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /api/music {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 네이버 서치어드바이저 HTML 파일 (경로는 서버 실제 위치와 맞출 것)
    location = /naver610b795f37dec20c560862faab120be0.html {
        default_type text/html;
        alias /var/www/venysound-verification/naver610b795f37dec20c560862faab120be0.html;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
