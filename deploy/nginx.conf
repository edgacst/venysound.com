# /etc/nginx/sites-available/venysound.com
# 이 파일을 서버의 /etc/nginx/sites-available/venysound.com 에 복사 후
# sudo ln -s /etc/nginx/sites-available/venysound.com /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# www·apex 혼용 시 검색엔진 중복 방지: 표준 호스트는 https://venysound.com (apex)

# HTTP → HTTPS apex (한 번에 통일, www/http 혼선 방지)
server {
    listen 80;
    server_name venysound.com www.venysound.com;
    return 301 https://venysound.com$request_uri;
}

# HTTPS + www → HTTPS apex (주소창이 venysound.com 으로 바뀜)
server {
    listen 443 ssl http2;
    server_name www.venysound.com;

    ssl_certificate     /etc/letsencrypt/live/venysound.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venysound.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://venysound.com$request_uri;
}

# HTTPS apex — 실제 서비스
server {
    listen 443 ssl http2;
    server_name venysound.com;

    ssl_certificate     /etc/letsencrypt/live/venysound.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venysound.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /api/music {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # AI MP4·WAV·악보 등 장시간 처리 API — 기본 120s nginx 타임아웃(504) 방지
    location ~ ^/api/ai-music/(mp4-render|mp4-url|wav-url|score-pdf) {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 네이버 서치어드바이저 HTML 파일 (경로는 서버 실제 위치와 맞출 것)
    location = /naver610b795f37dec20c560862faab120be0.html {
        default_type text/html;
        alias /var/www/venysound-verification/naver610b795f37dec20c560862faab120be0.html;
    }

    # MP3 마스터링 스튜디오 (별도 Node 앱 — edgacst/mp3mastering, PM2 127.0.0.1:3001)
    # ^~ : 아래 정적 확장자 regex(5000)보다 우선 — /mastering/*.js 가 메인 앱으로 가지 않게
    location = /mastering {
        return 301 https://venysound.com/mastering/;
    }

    location ^~ /mastering/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 100M;
        client_body_timeout 600s;
        client_body_buffer_size 128k;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering on;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
