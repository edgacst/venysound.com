# 무중단 배포용: upstream으로 5000/5001 스위칭
# /etc/nginx/sites-available/venysound.com 에 복사 후 사용
# 스위칭: 아래 upstream에서 현재 서비스 중인 포트만 주석 해제하고, 나머지는 주석 처리한 뒤
#   sudo nginx -t && sudo systemctl reload nginx
#
# www·apex: 표준은 https://venysound.com — www 는 301 로 통일

upstream venysound_backend {
    server 127.0.0.1:5000;
    # server 127.0.0.1:5001;
}

server {
    listen 80;
    server_name venysound.com www.venysound.com;
    return 301 https://venysound.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.venysound.com;

    ssl_certificate     /etc/letsencrypt/live/venysound.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venysound.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://venysound.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name venysound.com;

    ssl_certificate     /etc/letsencrypt/live/venysound.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venysound.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://venysound_backend;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /ws {
        proxy_pass http://venysound_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /api/music {
        proxy_pass http://venysound_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://venysound_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
