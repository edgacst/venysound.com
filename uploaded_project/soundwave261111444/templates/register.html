
<style>
    body {
        background: #f6f7fb;
    }
    .register-card {
        max-width: 370px;
        margin: 40px auto;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.10);
        padding: 32px 28px 24px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .register-card .icon {
        font-size: 3.2rem;
        color: #219150;
        margin-bottom: 8px;
    }
    .register-card h2 {
        color: #219150;
        font-weight: 700;
        margin-bottom: 6px;
        font-size: 2.1rem;
    }
    .register-card p {
        color: #6c757d;
        margin-bottom: 22px;
        font-size: 1.05rem;
    }
    .register-card label {
        font-weight: 600;
        color: #222;
        margin-bottom: 6px;
        font-size: 1rem;
    }
    .register-card input[type="text"],
    .register-card input[type="email"],
    .register-card input[type="password"] {
        width: 100%;
        border: 1.5px solid #e0e0e0;
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 1.08rem;
        margin-bottom: 16px;
        background: #f6f7fb;
        transition: border 0.2s;
    }
    .register-card input:focus {
        border: 1.5px solid #219150;
        outline: none;
        background: #f0f7f3;
    }
    .register-card .input-group {
        width: 100%;
        display: flex;
        align-items: center;
        background: none;
        border: none;
        margin-bottom: 18px;
    }
    .register-card .input-group input {
        margin-bottom: 0;
        background: #f6f7fb;
    }
    .register-card .input-group button {
        border: none;
        background: none;
        margin-left: -38px;
        z-index: 2;
        color: #888;
        font-size: 1.3rem;
        padding: 0 8px;
        cursor: pointer;
        transition: color 0.2s;
    }
    .register-card .input-group button:focus {
        outline: none;
        color: #219150;
    }
    .register-card .register-btn {
        width: 100%;
        background: #219150;
        color: #fff;
        font-size: 1.18rem;
        font-weight: 700;
        border: none;
        border-radius: 999px;
        padding: 13px 0 12px 0;
        margin-bottom: 18px;
        transition: background 0.2s;
    }
    .register-card .register-btn:hover {
        background: #176b3a;
    }
    .register-card .bottom-text {
        color: #888;
        font-size: 0.98rem;
        margin-top: 2px;
    }
    .register-card .bottom-text a {
        color: #219150;
        font-weight: 600;
        text-decoration: none;
        margin-left: 2px;
    }
    .register-card .bottom-text a:hover {
        text-decoration: underline;
    }
</style>

<div class="register-card">
    <div class="icon"><i class="fas fa-user-plus"></i></div>
    <h2>회원가입</h2>
    <p>나만의 음악 공간을 만들어보세요</p>
    <form id="registerForm" style="width:100%;">
        <label for="reg_username">아이디</label>
        <input type="text" id="reg_username" placeholder="아이디" required>
        <label for="reg_email">이메일</label>
        <input type="email" id="reg_email" placeholder="example@email.com" required>
        <label for="reg_password">비밀번호</label>
        <div class="input-group">
            <input type="password" id="reg_password" placeholder="비밀번호" required>
            <button type="button" id="toggleRegPassword"><i class="fas fa-eye"></i></button>
        </div>
        <button type="submit" class="register-btn">가입하기</button>
    </form>
    <div class="bottom-text">
        이미 계정이 있으신가요?
        <a href="#" onclick="switchToLoginModal()">로그인</a>
    </div>
</div>

<script>
// I've added this because the function name was generic in the last turn.
function switchToLoginModal() {
    const registerModalEl = document.getElementById('registerModal');
    if (registerModalEl) {
        const registerModal = bootstrap.Modal.getInstance(registerModalEl);
        if (registerModal) {
            registerModal.hide();
        }
    }
    const loginModalEl = document.getElementById('loginModal');
    if (loginModalEl) {
        // Use a slight delay to ensure the first modal is gone
        setTimeout(() => {
            const loginModal = new bootstrap.Modal(loginModalEl);
            loginModal.show();
        }, 500);
    }
}


// 비밀번호 보이기/숨기기 토글 기능
document.getElementById('toggleRegPassword').addEventListener('click', function() {
    const passwordInput = document.getElementById('reg_password');
    const icon = this.querySelector('i');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('reg_username').value;
    const email = document.getElementById('reg_email').value;
    const password = document.getElementById('reg_password').value;

    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, email, password})
        });
        const data = await res.json();
        
        if (data.success) {
            alert('회원가입 성공! 로그인해주세요.');
            switchToLoginModal();
        } else {
            alert(data.error || '가입 실패');
        }
    } catch (err) {
        alert('서버 통신 오류가 발생했습니다.');
    }
});
</script>
