<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SoundWave 플레이어</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f7f8fa; }
        .player-wrap { max-width: 420px; margin: 32px auto; background: #fff; border-radius: 18px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 32px 24px; }
        .track-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
        .track-artist { font-size: 1rem; color: #555; margin-bottom: 1.2rem; }
        .player-controls { display: flex; gap: 16px; justify-content: center; margin-top: 1.5rem; }
    </style>
</head>
<body>
<div class="player-wrap text-center">
    <div class="track-title" id="popupPlayerTitle"></div>
    <div class="track-artist" id="popupPlayerArtist"></div>
    <audio id="popupPlayerAudio" controls style="width:100%;"></audio>
    <div class="player-controls">
        <button id="popupPrevBtn" class="btn btn-outline-primary btn-sm">이전</button>
        <button id="popupNextBtn" class="btn btn-outline-primary btn-sm">다음</button>
        <button id="popupStopBtn" class="btn btn-outline-danger btn-sm">정지</button>
    </div>
</div>
<script>
let tracks = [];
let playIndex = 0;
let isPlaying = false;

function playTrack(idx) {
    if (!tracks.length) return;
    playIndex = idx;
    if (playIndex < 0) playIndex = 0;
    if (playIndex >= tracks.length) playIndex = tracks.length - 1;
    const t = tracks[playIndex];
    document.getElementById('popupPlayerTitle').textContent = t.title;
    document.getElementById('popupPlayerArtist').textContent = t.artist;
    const audio = document.getElementById('popupPlayerAudio');
    audio.src = t.url;
    audio.play();
    isPlaying = true;
}

document.getElementById('popupPrevBtn').onclick = function() {
    if (playIndex > 0) playTrack(playIndex - 1);
};
document.getElementById('popupNextBtn').onclick = function() {
    if (playIndex < tracks.length - 1) playTrack(playIndex + 1);
};
document.getElementById('popupStopBtn').onclick = function() {
    document.getElementById('popupPlayerAudio').pause();
    isPlaying = false;
};
document.getElementById('popupPlayerAudio').onended = function() {
    if (isPlaying && playIndex < tracks.length - 1) playTrack(playIndex + 1);
};

// opener에서 window.open(..., tracks)로 넘긴 데이터 받기
window.addEventListener('DOMContentLoaded', function() {
    if (window.opener && window.opener.__popupTracks) {
        tracks = window.opener.__popupTracks;
        playTrack(0);
    }
});
</script>
</body>
</html>
