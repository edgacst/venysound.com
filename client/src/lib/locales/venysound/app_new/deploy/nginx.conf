# /etc/nginx/sites-available/venysound.com
# 이 파일을 서버의 /etc/nginx/sites-available/venysound.com 에 복사 후
# sudo ln -s /etc/nginx/sites-available/venysound.com /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name venysound.com www.venysound.com;
    # HTTP → HTTPS 리다이렉트 (certbot이 자동으로 추가해줌)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name venysound.com www.venysound.com;

    # SSL 인증서 경로 (certbot 실행 후 자동 생성됨)
    ssl_certificate     /etc/letsencrypt/live/venysound.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venysound.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 업로드 파일 최대 크기 (음원 파일 고려 - 100MB)
    client_max_body_size 100M;

    # 음원 스트리밍 최적화
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 정적 파일 캐싱
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket 지원
    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # 음원 스트리밍 (Range 요청 지원)
    location /api/music {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 스트리밍을 위해 버퍼링 비활성화
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 나머지 모든 요청
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
